FileVersion = 1

[Project]
Name = "BeefForms.Sample"
StartupObject = "BeefForms.Sample.Program"

[Dependencies]
corlib = "*"
BeefForms = "*"
"BeefForms.SDL" = "*"

[Platform.Windows]
IconFile = "../Resources/BeefForms.ico"
ManifestFile = "../win32.manifest"

[Configs.Debug.Win64]
DebugCommandArguments = "--sdl"

[Configs.Debug.wasm32]
TargetName = "BeefForms.html"

[Configs.Release.wasm32]
TargetName = "BeefForms.html"
