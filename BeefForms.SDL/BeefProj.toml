FileVersion = 1

[Project]
Name = "BeefForms.SDL"

[Dependencies]
corlib = "*"
BeefForms = "*"
SDL2 = "*"
BeefGL = {Git = "https://github.com/disarray2077/BeefGL"}

[Configs.Debug.wasm32]
OtherLinkFlags = "$(LinkFlags) -sUSE_SDL=2 -sUSE_SDL_TTF=2 -sMIN_WEBGL_VERSION=2 -sMAX_WEBGL_VERSION=2 --preload-file \"$(ProjectDir)/Resources/fonts@/BeefForms/fonts\""
LinkDependencies = ["$(ProjectDir)/Resources/fonts/NotoSans-Regular.ttf", "$(ProjectDir)/Resources/fonts/OFL.txt"]

[Configs.Release.wasm32]
OtherLinkFlags = "$(LinkFlags) -sUSE_SDL=2 -sUSE_SDL_TTF=2 -sMIN_WEBGL_VERSION=2 -sMAX_WEBGL_VERSION=2 --preload-file \"$(ProjectDir)/Resources/fonts@/BeefForms/fonts\""
LinkDependencies = ["$(ProjectDir)/Resources/fonts/NotoSans-Regular.ttf", "$(ProjectDir)/Resources/fonts/OFL.txt"]
